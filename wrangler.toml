name = "edge-chat-demo"
main = "src/chat.mjs"         # ← your old build.upload.dir + main ⇒ src/chat.mjs
workers_dev = true
compatibility_date = "2021-11-08"  # keep for now; bump later if you want

# If you import .html files inside your Worker (as text/data), keep this:
rules = [
  { type = "Data", globs = ["**/*.html"] }
]

[durable_objects]
bindings = [
  { name = "rooms",    class_name = "ChatRoom" },
  { name = "limiters", class_name = "RateLimiter" }
]

[[migrations]]
tag = "v1" 
new_classes = ["ChatRoom", "RateLimiter"]
# If you're on the Free plan or want the newer backend, use this instead of the line above:
# new_sqlite_classes = ["ChatRoom", "RateLimiter"]